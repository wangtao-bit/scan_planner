# Topic bridge between go2_sim_ws (Gazebo Classic + CHAMP + Velodyne)
# and SCAN-Planner's /quad_0/* interfaces.
#
# world->odom TF is NOT published here — run.launch starts a single
# tf2_ros/static_transform_publisher for that edge (avoids TF flicker).
gazebo_sim_bridge:
  ros__parameters:
    odom_topic: /odom/ground_truth
    cloud_topic: /velodyne_points
    gazebo_cmd_vel_topic: /cmd_vel
    body_pose_topic: /quad_0/body_pose
    sensor_pose_topic: /quad_0/lidar_pose
    planner_cloud_topic: /quad_0/cloud
    planner_cmd_vel_topic: /quad_0/cmd_vel
    odom_frame: odom
    force_odom_frame_id: true
    tf_timeout_sec: 0.05
    use_sim_time: true
