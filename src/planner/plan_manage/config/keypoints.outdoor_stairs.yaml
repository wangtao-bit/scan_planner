# 模式2 预设导航点：outdoor_complex.world 楼梯爬越测试（navi_mode:=2）
#
# 路线：楼梯起步 → 南梯8级上楼 → 高台 → 北梯8级下楼 → 终点(4,21)
# 共13个点，逐点导航（每点到达0.5m内自动切下一个）。
#
# ⚠ z 约定与模式3不同：模式2 不自动加 body_height，此处直接写机身目标高度。
#
# z = 踏面/地面高度 + 0.55（不是 +0.4！）：
#   航点z=踏面+0.4时，前圆柱(+0.18)恰好探到下一级台阶膨胀顶(踏面+0.15+0.1膨胀
#   +网格量化≈+0.30)的±1格闪烁带 → 占据概率翻转 → 目标被误判占据 →
#   adjustGlobalTargetIfOccupied 沿轨迹回退时选到弹跳速度导致的轨迹凹陷点
#   (楼梯箱体内部未知=free) → 目标塌进实体。+0.55 留 0.25m 实余量避开闪烁带。
#
# 使用：
#   ros2 launch scan_planner run.launch.py navi_mode:=2 \
#     keypoints_file:=<此文件的绝对路径>
# 密集航点版（z=踏面+0.55 约定，逐0.6m布点——回归基准）：
# scan_planner_node:
#   ros__parameters:
#     fsm.waypoints: [
#        0.0,  9.00, 0.55,  # 楼梯起步（地面 0+0.55）
#        0.0, 10.45, 0.85,  # 南梯第2级踏面（0.30+0.55）
#        0.0, 11.05, 1.15,  # 第4级（0.60+0.55）
#        0.0, 11.65, 1.45,  # 第6级（0.90+0.55）
#        0.0, 12.25, 1.75,  # 第8级梯顶（1.20+0.55）
#        0.0, 13.50, 1.75,  # 高台（1.20+0.55）
#        0.0, 15.20, 1.75,  # 高台
#        0.0, 16.85, 1.60,  # 北梯下第1级（1.05+0.55）
#        0.0, 17.45, 1.30,  # 下第3级（0.75+0.55）
#        0.0, 18.05, 1.00,  # 下第5级（0.45+0.55）
#        0.0, 18.65, 0.70,  # 下第7级（0.15+0.55）
#        0.0, 20.00, 0.55,  # 楼梯北侧地面
#        4.0, 21.00, 0.55   # 终点（箭头处，树旁）
#     ]

# 稀疏航点版（方案2 验证通过 2026-10-19：z 只写机身实际高度(表面+0.27)的粗略值，
# 全局轨迹地形感知加密(manager.global_traj_z_margin=0.4)自动把采样点/起点(远目标)
# 吸附到 表面顶+0.4，楼梯段剖面自动贴合阶梯）：
scan_planner_node:
  ros__parameters:
    fsm.waypoints: [
       0.14, 8.6, 0.27,
       0.15, 13.99, 1.48,  # 高台（箭头处）
       -0.31, 21.88, 0.27  # 终点（树旁）
    ]
