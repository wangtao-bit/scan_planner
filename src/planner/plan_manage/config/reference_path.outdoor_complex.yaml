# 先验参考路径：outdoor_complex.world（模式3 / navi_mode:=3）
#
# 路线（单向）：出生坪(0.5,0.5) → 北上穿锥桶slalom → 南梯8级上楼(z 0→1.2)
#   → 高台(4×4m, z=1.2) → 北梯8级下楼(z 1.2→0) → 终点在楼梯东北侧地面(4,21)
#
# 楼梯几何：踏高0.15/踏深0.30/宽4.0，南梯y=10起，高台y∈[12.4,16.4]，北梯至y=18.8
# z 为踏面/地面高度（规划器自动加 grid_map.body_height=0.4），
# 相邻航点间距须≥0.5m（prepareReferenceWaypoints 会过滤更近的点）。
#
# 使用：
#   1. gazebo_sim.yaml: world: outdoor_complex.world
#   2. ros2 launch scan_planner run.launch.py navi_mode:=3 \
#        reference_path_file:=<此文件的绝对路径>
reference_path_publisher:
  ros__parameters:
    frame_id: world
    publish_delay_sec: 0.5
    waypoints:
      [0.5, 0.5, 0.00,   # 出生点（狗的位置）
       0.5, 4.0, 0.00,   # 北上穿slalom中线（锥桶在x=±2.5）
       0.0, 9.0, 0.00,   # 对齐楼梯中线
       # ---- 南梯上行（每2级踏步1个航点）----
       0.0, 10.45, 0.30, # 第2级踏面
       0.0, 11.05, 0.60, # 第4级
       0.0, 11.65, 0.90, # 第6级
       0.0, 12.25, 1.20, # 第8级（梯顶）
       # ---- 高台 ----
       0.0, 13.50, 1.20,
       0.0, 15.20, 1.20,
       # ---- 北梯下行 ----
       0.0, 16.85, 1.05, # 下第1级
       0.0, 17.45, 0.75, # 下第3级
       0.0, 18.05, 0.45, # 下第5级
       0.0, 18.65, 0.15, # 下第7级（最后一级）
       # ---- 下楼后走到终点（箭头处，树旁）----
       0.0, 20.00, 0.00,
       4.0, 21.00, 0.00] # 终点
