# 模式2 预设导航点：outdoor_complex.world 多楼层爬越测试（navi_mode:=2）
#
# 世界新增 multifloor 模型（x[-2,2]，2026-10-20）：
#   楼梯1(8级) y[21.5,23.9] 地面→F1    F1平台 y[23.9,26.9] 顶1.2
#   楼梯2(8级) y[26.9,29.3] F1→F2     F2平台 y[29.3,32.3] 顶2.4
#   下行(16级) y[32.3,37.1] F2→地面   终点平地 y≈39.5
#   踏步规格与现有楼梯一致：踏深0.30 / 踏高0.15 / 宽4.0；边界墙已扩至±45
#
# 路线：现有南梯8级上→现有高台→现有北梯8级下→新楼1梯上F1→F1平台→
#       新楼2梯上F2→F2平台→16级下行→地面终点(0,39.5)
#
# ⚠ z 约定与模式3不同：模式2 不自动加 body_height，此处直接写机身目标高度。
#
# 使用：
#   ros2 launch scan_planner run.launch.py navi_mode:=2 \
#     keypoints_file:=<此文件的绝对路径>
#
# 密集航点版（z=踏面+0.55 约定，逐0.6m布点——回归基准）：
scan_planner_node:
  ros__parameters:
    fsm.waypoints: [
       0.00,  9.00, 0.55,  # 现有南梯起步（地面 0+0.55）
       0.00, 10.45, 0.85,  # 南梯第2级踏面（0.30+0.55）
       0.00, 11.05, 1.15,  # 南梯第4级（0.60+0.55）
       0.00, 11.65, 1.45,  # 南梯第6级（0.90+0.55）
       0.00, 12.25, 1.75,  # 南梯第8级梯顶（1.20+0.55）
       0.00, 13.50, 1.75,  # 现有高台
       0.00, 15.20, 1.75,  # 现有高台
       0.00, 16.85, 1.60,  # 现有北梯下第1级（1.05+0.55）
       0.00, 17.45, 1.30,  # 下第3级（0.75+0.55）
       0.00, 18.05, 1.00,  # 下第5级（0.45+0.55）
       0.00, 18.65, 0.70,  # 下第7级（0.15+0.55）
       0.00, 20.60, 0.55,  # 新楼起步平地
       0.00, 21.95, 0.85,  # 新楼1梯第2级（0.30+0.55）
       0.00, 22.55, 1.15,  # 1梯第4级（0.60+0.55）
       0.00, 23.15, 1.45,  # 1梯第6级（0.90+0.55）
       0.00, 23.75, 1.75,  # 1梯第8级梯顶=F1（1.20+0.55）
       0.00, 24.90, 1.75,  # F1平台
       0.00, 26.10, 1.75,  # F1平台
       0.00, 27.35, 2.05,  # 2梯第2级（1.50+0.55）
       0.00, 27.95, 2.35,  # 2梯第4级（1.80+0.55）
       0.00, 28.55, 2.65,  # 2梯第6级（2.10+0.55）
       0.00, 29.15, 2.95,  # 2梯第8级梯顶=F2（2.40+0.55）
       0.00, 30.30, 2.95,  # F2平台
       0.00, 31.50, 2.95,  # F2平台
       0.00, 32.75, 2.80,  # 下行第2级（2.25+0.55）
       0.00, 33.35, 2.50,  # 下行第4级（1.95+0.55）
       0.00, 33.95, 2.20,  # 下行第6级（1.65+0.55）
       0.00, 34.55, 1.90,  # 下行第8级（1.35+0.55）
       0.00, 35.15, 1.60,  # 下行第10级（1.05+0.55）
       0.00, 35.75, 1.30,  # 下行第12级（0.75+0.55）
       0.00, 36.35, 1.00,  # 下行第14级（0.45+0.55）
       0.00, 36.95, 0.70,  # 下行第16级（0.15+0.55）
       0.00, 38.00, 0.55,  # 下完平地
       0.00, 39.50, 0.55   # 终点
    ]

# 稀疏航点版（默认激活：z 只写机身实际高度(表面+0.27~0.28)的粗略值，
# 全局轨迹地形感知加密(manager.global_traj_z_margin=0.4)自动把采样点/起点(远目标)
# 吸附到 表面顶+0.4，楼梯段剖面自动贴合阶梯）：
# scan_planner_node:
#   ros__parameters:
#     fsm.waypoints: [
#        0.14,  8.60, 0.27,  # 现有南梯起步
#        0.15, 13.99, 1.48,  # 现有高台（1.2+0.28）
#        0.00, 20.60, 0.27,  # 新楼起步平地
#        0.00, 25.40, 1.48,  # F1平台（1.2+0.28）
#        0.00, 30.80, 2.68,  # F2平台（2.4+0.28）
#        0.00, 39.50, 0.27   # 终点（下行后平地）
#     ]
